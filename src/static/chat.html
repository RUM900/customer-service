<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能客服系统</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font: 14px/1.6 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f2f5; height: 100vh; display: flex; }
.sidebar { width: 260px; background: #1a1a2e; color: #eee; display: flex; flex-direction: column; flex-shrink: 0; }
.sidebar-header { padding: 16px; border-bottom: 1px solid #333; }
.sidebar-header h2 { font-size: 16px; color: #e94560; }
.session-list { flex: 1; overflow-y: auto; padding: 8px; }
.session-item { padding: 10px 12px; border-radius: 6px; cursor: pointer; margin-bottom: 4px; font-size: 13px; }
.session-item:hover { background: #16213e; }
.session-item.active { background: #0f3460; border-left: 3px solid #e94560; }
.session-item .sid { color: #aaa; font-family: monospace; font-size: 11px; }
.session-item .preview { color: #888; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sidebar-footer { padding: 12px; border-top: 1px solid #333; }
.sidebar-footer button { width: 100%; padding: 10px; background: #e94560; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
.main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.chat-header { padding: 14px 20px; background: #fff; border-bottom: 1px solid #e0e0e0; display: flex; align-items: center; justify-content: space-between; }
.chat-header h3 { font-size: 16px; }
.messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
.msg { display: flex; gap: 8px; max-width: 80%; }
.msg.user { align-self: flex-end; flex-direction: row-reverse; }
.msg.agent { align-self: flex-start; }
.msg .avatar { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
.msg.user .avatar { background: #e94560; }
.msg.agent .avatar { background: #0f3460; }
.msg .bubble { padding: 10px 14px; border-radius: 12px; line-height: 1.5; word-break: break-word; }
.msg.user .bubble { background: #e94560; color: #fff; border-bottom-right-radius: 4px; }
.msg.agent .bubble { background: #fff; color: #333; border-bottom-left-radius: 4px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.msg .meta { font-size: 11px; color: #999; margin-top: 4px; display: flex; gap: 6px; flex-wrap: wrap; }
.msg .meta span { padding: 2px 6px; border-radius: 8px; font-size: 10px; }
.tag-intent { background: #e8f5e9; color: #2e7d32; }
.tag-sentiment { background: #fff3e0; color: #e65100; }
.tag-agent { background: #e3f2fd; color: #1565c0; }
.tag-resolved { background: #e8f5e9; color: #2e7d32; }
.tag-handoff { background: #fce4ec; color: #c62828; }
.input-area { padding: 14px 20px; background: #fff; border-top: 1px solid #e0e0e0; display: flex; gap: 10px; }
.input-area input { flex: 1; padding: 10px 14px; border: 1px solid #ddd; border-radius: 20px; font-size: 14px; outline: none; }
.input-area input:focus { border-color: #e94560; }
.input-area button { padding: 10px 20px; background: #e94560; color: #fff; border: none; border-radius: 20px; cursor: pointer; font-size: 14px; font-weight: 600; }
.input-area button:disabled { background: #ccc; cursor: not-allowed; }
#errorMsg { display: none; padding: 8px 16px; background: #ffebee; color: #c62828; font-size: 13px; text-align: center; }
.spin { display: inline-block; width: 14px; height: 14px; border: 2px solid #fff; border-top-color: transparent; border-radius: 50%; animation: spin .6s linear infinite; vertical-align: middle; margin-right: 4px; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="sidebar">
  <div class="sidebar-header"><h2>智能客服</h2></div>
  <div class="session-list" id="sessionList"><div style="color:#888;padding:12px;font-size:13px">点击下方按钮新建会话</div></div>
  <div class="sidebar-footer"><button onclick="newSession()">+ 新建会话</button></div>
</div>
<div class="main">
  <div class="chat-header"><h3 id="chatTitle">新建一个会话开始对话</h3></div>
  <div id="errorMsg"></div>
  <div class="messages" id="messages"><div style="color:#aaa;text-align:center;padding-top:80px">点击左侧 [+ 新建会话] 开始</div></div>
  <div class="input-area">
    <input type="text" id="msgInput" placeholder="输入消息..." onkeydown="if(event.key==='Enter')sendMsg()">
    <button id="sendBtn" onclick="sendMsg()">发送</button>
  </div>
</div>
<script>
var currentSession = null;
var sessions = {};

function showError(msg) {
  var el = document.getElementById('errorMsg');
  el.textContent = msg;
  el.style.display = 'block';
  setTimeout(function() { el.style.display = 'none'; }, 5000);
}

async function newSession() {
  try {
    var res = await fetch('/sessions', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    var data = await res.json();
    var sid = data.session_id;
    sessions[sid] = { id: sid, preview: '新会话', messages: [] };
    renderSessions();
    selectSession(sid);
  } catch (e) {
    showError('创建会话失败: ' + e.message);
    // 兜底：手动生成 session id
    var sid = 'sess_' + Math.random().toString(36).slice(2, 10);
    sessions[sid] = { id: sid, preview: '新会话', messages: [] };
    renderSessions();
    selectSession(sid);
  }
}

function selectSession(sid) {
  currentSession = sid;
  document.querySelectorAll('.session-item').forEach(function(el) { el.classList.remove('active'); });
  var el = document.getElementById('sess-' + sid);
  if (el) el.classList.add('active');
  document.getElementById('chatTitle').textContent = '会话 #' + sid.slice(-8);
  renderMessages();
}

function renderSessions() {
  var list = document.getElementById('sessionList');
  var html = '';
  for (var id in sessions) {
    var s = sessions[id];
    html += '<div class="session-item' + (id === currentSession ? ' active' : '') + '" id="sess-' + id + '" onclick="selectSession(\'' + id + '\')">';
    html += '<div class="sid">#' + id.slice(-12) + '</div>';
    html += '<div class="preview">' + (s.preview || '新会话') + '</div>';
    html += '</div>';
  }
  list.innerHTML = html || '<div style="color:#888;padding:12px;font-size:13px">无会话</div>';
}

function renderMessages() {
  var container = document.getElementById('messages');
  var s = sessions[currentSession];
  if (!s || !s.messages.length) {
    container.innerHTML = '<div style="color:#aaa;text-align:center;padding-top:80px">输入消息开始对话</div>';
    return;
  }
  var html = '';
  s.messages.forEach(function(m) {
    var isUser = m.role === 'user';
    var meta = m.meta || {};
    html += '<div class="msg ' + (isUser ? 'user' : 'agent') + '">';
    html += '<div class="avatar">' + (isUser ? 'U' : 'AI') + '</div>';
    html += '<div><div class="bubble">' + escapeHtml(m.content) + '</div>';
    if (Object.keys(meta).length) {
      html += '<div class="meta">';
      if (meta.intent) html += '<span class="tag-intent">' + meta.intent + '</span>';
      if (meta.sentiment) html += '<span class="tag-sentiment">' + meta.sentiment + '</span>';
      if (meta.agent) html += '<span class="tag-agent">' + meta.agent + '</span>';
      if (meta.status === 'resolved') html += '<span class="tag-resolved">已解决</span>';
      if (meta.status === 'handoff') html += '<span class="tag-handoff">已转人工</span>';
      html += '</div>';
    }
    html += '</div></div>';
  });
  container.innerHTML = html;
  container.scrollTop = container.scrollHeight;
}

function escapeHtml(text) {
  var div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML.replace(/\n/g, '<br>');
}

async function sendMsg() {
  var input = document.getElementById('msgInput');
  var msg = input.value.trim();
  if (!msg) return;
  if (!currentSession) {
    showError('请先点击 [+ 新建会话] 创建会话');
    return;
  }
  input.value = '';
  var btn = document.getElementById('sendBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span>';

  sessions[currentSession].messages.push({ role: 'user', content: msg });
  sessions[currentSession].preview = msg.slice(0, 30);
  renderSessions();
  renderMessages();

  try {
    var res = await fetch('/chat/' + currentSession, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: msg })
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    var data = await res.json();

    var meta = {};
    if (data.intent) meta.intent = data.intent;
    if (data.sentiment) meta.sentiment = data.sentiment;
    if (data.agent_name) meta.agent = data.agent_name;
    if (data.status === 'resolved') meta.status = 'resolved';
    if (data.status === 'handoff') meta.status = 'handoff';

    sessions[currentSession].messages.push({ role: 'agent', content: data.reply || '(空回复)', meta: meta });
    sessions[currentSession].preview = (data.reply || '').slice(0, 30);
    renderSessions();
    renderMessages();
  } catch (e) {
    sessions[currentSession].messages.push({ role: 'agent', content: '错误: ' + e.message, meta: {} });
    renderMessages();
    showError('发送失败: ' + e.message);
  }
  btn.disabled = false;
  btn.innerHTML = '发送';
}
</script>
</body>
</html>
