[alembic]
# 迁移脚本目录
script_location = migrations

# 禁止自动生成空的 migration
prepend_sys_path = .

# SQLAlchemy 连接 URL（会被 env.py 中的配置覆盖）
# 这里留空，由 env.py 从 config.DATABASE_URL 读取并转换
sqlalchemy.url =

# 日志配置
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
